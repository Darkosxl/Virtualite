<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' blob: https://www.google.com https://www.gstatic.com https://connect.facebook.net https://static.cloudflareinsights.com https://infird.com https://cdn.jsdelivr.net; frame-src https://www.google.com https://www.gstatic.com; object-src 'none';">
    <link rel="icon" type="image/x-icon" href="/pictures/amoreditlogo.png">
    <title>Amoredit - Kaydırmayı Durduran İçerikler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: white;
            overflow-x: hidden;
            cursor: none;
        }

        /* Ensure cursor stays consistent */
        *, *:before, *:after, *:hover, *:active, *:focus {
            cursor: none !important;
        }

        /* Override specific hover states */
        .calendar-day:hover, .time-slot:hover,
        button:hover, input:hover, label:hover,
        .content-card:hover, .cta-button:hover {
            cursor: none !important;
        }

        /* Custom cursor - hidden on mobile */
        .cursor {
            width: 1.25vw;
            height: 1.25vw;
            min-width: 15px;
            min-height: 15px;
            max-width: 25px;
            max-height: 25px;
            border: 0.125vw solid #F2522E;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.05s ease;
            will-change: transform;
            display: block;
        }

        @media (max-width: 768px) {
            .cursor {
                display: none;
            }
        }

        .cursor.hover {
            transform: scale(1.5);
            border-color: #F24535;
            background-color: rgba(242, 69, 53, 0.2);
        }

        /* Hide reCAPTCHA badge on mobile */
        @media (max-width: 768px) {
            .grecaptcha-badge {
                display: none !important;
            }
        }

        /* Ensure content appears above backgrounds */
        section, header, main, footer, .hero, .contact-section {
            position: relative;
            z-index: 10;
        }
    </style>

    <!-- HTMX for reactive forms (local) -->
    <script src="/js/htmx.min.js"></script>

    <!-- Three.js for 3D shader animation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Google reCAPTCHA v3 - Replace YOUR_SITE_KEY with your actual site key -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LfyocYrAAAAAAO2wxWMTCTxNWrbS-qVSU_woJjU"></script>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '787530457230374');
    
    // Generate unique event ID for deduplication
    const pageViewEventId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
    
    // Track PageView with event_id for deduplication
    fbq('track', 'PageView', { event_id: pageViewEventId });
    
    // Add server-side PageView tracking (bypasses ad blockers)
    function getCookie(name) {
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
    }

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=787530457230374&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>
<body>
    <div class="cursor"></div>
    <div id="hero-container"></div>

    <div id="content-container"></div>

    <style>
    /* Contact section - static gradient */
    .contact-section {
        min-height: 100vh;
        padding: 5vh 2vw;
        background: transparent;
        text-align: center;
        margin-top: 0;
        position: relative;
        z-index: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .contact-title {
        font-size: clamp(2.5rem, 4vw, 5rem);
        font-weight: 800;
        margin-bottom: 2vh;
        color: white;
    }

    .contact-subtitle {
        font-size: clamp(1.2rem, 1.4vw, 1.6rem);
        margin-bottom: 3vh;
        opacity: 0.9;
    }

    .booking-container {
        max-width: 90%;
        width: 100%;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 1.875vw;
        padding: 3vh 2vw;
        border: 0.0625vw solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 1.5625vw 3.125vw rgba(0, 0, 0, 0.1);
    }

    /* Sunglasses animation canvas REMOVED - was causing black rectangle issue */

    @media (max-width: 1200px) {
        .booking-container {
            max-width: 85%;
        }
    }

    @media (max-width: 768px) {
        .booking-container {
            max-width: 95%;
            padding: 4vh 4vw;
            border-radius: 4vw;
        }
    }
    </style>

    <section class="contact-section" id="contact">
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h2 class="contact-title" data-tr="Tanışalım mı?" data-en="Shall we meet?" data-it="Conosciamoci!">Tanışalım mı?</h2>
            <p class="contact-subtitle" data-tr="sana uygun saati seç, seni arayalım!" data-en="pick a suitable time & let us call you!" data-it="scegli un orario adatto per te, ti chiamiamo noi!">sana uygun saati seç, seni arayalım!</p>
        </div>

        <div class="booking-container" id="booking-form-container">
            <!-- Booking form will be loaded here -->
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>
    <script>
        // Load all sections first (including booking form), THEN load app.js
        Promise.all([
            fetch('/hero-section').then(r => r.text()).then(html => {
                document.getElementById('hero-container').innerHTML = html;
            }),
            fetch('/content-section').then(r => r.text()).then(html => {
                document.getElementById('content-container').innerHTML = html;
            }),
            fetch('/unified-booking-form').then(r => r.text()).then(html => {
                document.getElementById('booking-form-container').innerHTML = html;
            }),
            fetch('/footer-section').then(r => r.text()).then(html => {
                document.getElementById('footer-container').innerHTML = html;
            })
        ]).then(() => {
            // All sections loaded - NOW wait for browser to render before initializing
            console.log('📦 All sections fetched, waiting for DOM to render...');
            
            // Use double requestAnimationFrame to ensure DOM is fully rendered
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    console.log('✅ DOM rendered, starting initialization...');
                    
                    // 1. Initialize shader animation in hero section
                    initShaderAnimation();

                    // 2. Initialize language switching
                    initLanguageSwitching();

                    // 3. Initialize video carousel
                    initVideoCarousel();

                    // 4. Initialize video-lite system
                    initVideoLite();

                    // 5. Execute inline scripts from loaded sections (innerHTML doesn't auto-execute scripts)
                    const bookingFormContainer = document.getElementById('booking-form-container');
                    const inlineScripts = bookingFormContainer.querySelectorAll('script');
                    inlineScripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                        oldScript.remove();
                    });

                    // 6. Trigger DOMContentLoaded for booking form scripts
                    const event = new Event('DOMContentLoaded');
                    document.dispatchEvent(event);

                    // 7. Load app.js and then explicitly initialize
                    const appScript = document.createElement('script');
                    appScript.src = '/js/app.js?v=' + Date.now(); // Cache bust to force reload with 13 videos
                    appScript.onload = function() {
                        console.log('✅ app.js loaded, now initializing...');
                        // Give browser one more frame to ensure app.js functions are ready
                        requestAnimationFrame(() => {
                            if (typeof initializeApp === 'function') {
                                initializeApp();
                            } else {
                                console.error('❌ initializeApp function not found in app.js');
                            }
                        });
                    };
                    appScript.onerror = function() {
                        console.error('❌ Failed to load app.js');
                    };
                    document.body.appendChild(appScript);
                });
            });
        }).catch(error => console.error('Error loading sections:', error));

        // Shader Animation - Initialize after hero section loads
        function initShaderAnimation() {
            // Wait for hero section to be loaded
            const heroSection = document.querySelector('.hero');
            if (!heroSection || typeof THREE === 'undefined') {
                console.error('❌ Shader animation failed: Hero section or THREE.js not found');
                return;
            }

            // Create container div for shader animation
            const container = document.createElement('div');
            container.id = 'shader-animation';
            container.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background: #000; overflow: hidden;';
            heroSection.insertBefore(container, heroSection.firstChild);

            // Vertex shader
            const vertexShader = `
                void main() {
                    gl_Position = vec4( position, 1.0 );
                }
            `;

            // Fragment shader
            const fragmentShader = `
                #define TWO_PI 6.2831853072
                #define PI 3.14159265359

                precision highp float;
                uniform vec2 resolution;
                uniform float time;

                void main(void) {
                    vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
                    float t = time*0.05;
                    float lineWidth = 0.002;

                    vec3 color = vec3(0.0);
                    for(int j = 0; j < 3; j++){
                        for(int i=0; i < 5; i++){
                            color[j] += lineWidth*float(i*i) / abs(fract(t - 0.01*float(j)+float(i)*0.01)*5.0 - length(uv) + mod(uv.x+uv.y, 0.2));
                        }
                    }
                    
                    gl_FragColor = vec4(color[0],color[1],color[2],1.0);
                }
            `;

            // Initialize Three.js scene
            const camera = new THREE.Camera();
            camera.position.z = 1;

            const scene = new THREE.Scene();
            const geometry = new THREE.PlaneGeometry(2, 2);

            const uniforms = {
                time: { type: "f", value: 1.0 },
                resolution: { type: "v2", value: new THREE.Vector2() }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);

            container.appendChild(renderer.domElement);

            // Handle window resize
            const onWindowResize = () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                renderer.setSize(width, height);
                uniforms.resolution.value.x = renderer.domElement.width;
                uniforms.resolution.value.y = renderer.domElement.height;
            };

            // Initial resize
            onWindowResize();
            window.addEventListener("resize", onWindowResize, false);

            // Animation loop
            let animationId;
            const animate = () => {
                animationId = requestAnimationFrame(animate);
                uniforms.time.value += 0.025;
                renderer.render(scene, camera);
            };

            // Start animation
            animate();

            console.log('✅ Shader animation initialized successfully');

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                cancelAnimationFrame(animationId);
                window.removeEventListener("resize", onWindowResize);
                renderer.dispose();
                geometry.dispose();
                material.dispose();
            });
        }

        // Language switching functions
        function switchLanguage(selectedLang) {
            document.querySelectorAll('[data-tr]').forEach(element => {
                const text = element.getAttribute('data-' + selectedLang);
                if (text) {
                    element.textContent = text;
                }
            });

            // Handle placeholder translations
            document.querySelectorAll('input[data-placeholder-tr]').forEach(input => {
                const placeholderText = input.getAttribute('data-placeholder-' + selectedLang);
                if (placeholderText) {
                    input.placeholder = placeholderText;
                }
            });
        }

        function initLanguageSwitching() {
            const selectedLanguage = document.getElementById('selectedLanguage');
            const languageOptions = document.getElementById('languageOptions');

            if (!selectedLanguage || !languageOptions) {
                console.error('Language dropdown elements not found');
                return;
            }

            // Toggle dropdown
            selectedLanguage.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = languageOptions.classList.contains('show');
                
                if (isOpen) {
                    // Closing
                    languageOptions.classList.remove('show');
                    selectedLanguage.classList.remove('open');
                } else {
                    // Opening
                    languageOptions.classList.add('show');
                    selectedLanguage.classList.add('open');
                }
            });

            // Handle language selection
            document.querySelectorAll('.language-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const selectedLang = this.getAttribute('data-lang');
                    const flagSrc = this.querySelector('.flag-icon').src;

                    // Update selected language display (only flag)
                    selectedLanguage.querySelector('.flag-icon').src = flagSrc;

                    // Hide dropdown
                    languageOptions.classList.remove('show');
                    selectedLanguage.classList.remove('open');

                    // Store selected language
                    localStorage.setItem('selectedLanguage', selectedLang);
                    switchLanguage(selectedLang);
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
                if (!event.target.closest('.language-dropdown')) {
                    languageOptions.classList.remove('show');
                    selectedLanguage.classList.remove('open');
                }
            });

            // Apply saved language on page load
            const savedLang = localStorage.getItem('selectedLanguage') || 'en';
            const savedOption = document.querySelector(`[data-lang="${savedLang}"]`);
            if (savedOption) {
                const flagSrc = savedOption.querySelector('.flag-icon').src;
                selectedLanguage.querySelector('.flag-icon').src = flagSrc;
            }
            switchLanguage(savedLang);

            // Watch for dynamically loaded content
            const observer = new MutationObserver(function(mutations) {
                const selectedLang = localStorage.getItem('selectedLanguage') || 'en';
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1) {
                            const elementsWithTranslations = node.querySelectorAll ? node.querySelectorAll('[data-tr]') : [];
                            elementsWithTranslations.forEach(element => {
                                const text = element.getAttribute('data-' + selectedLang);
                                if (text) {
                                    element.textContent = text;
                                }
                            });

                            const elementsWithPlaceholders = node.querySelectorAll ? node.querySelectorAll('input[data-placeholder-tr]') : [];
                            elementsWithPlaceholders.forEach(input => {
                                const placeholderText = input.getAttribute('data-placeholder-' + selectedLang);
                                if (placeholderText) {
                                    input.placeholder = placeholderText;
                                }
                            });

                            if (node.getAttribute && node.getAttribute('data-tr')) {
                                const text = node.getAttribute('data-' + selectedLang);
                                if (text) {
                                    node.textContent = text;
                                }
                            }

                            if (node.tagName === 'INPUT' && node.getAttribute && node.getAttribute('data-placeholder-tr')) {
                                const placeholderText = node.getAttribute('data-placeholder-' + selectedLang);
                                if (placeholderText) {
                                    node.placeholder = placeholderText;
                                }
                            }
                        }
                    });
                });
            });

            observer.observe(document.body, { childList: true, subtree: true });
        }

        function initVideoCarousel() {
            const cards = document.querySelectorAll('.video-card');
            const prevBtn = document.querySelector('.carousel-prev');
            const nextBtn = document.querySelector('.carousel-next');
            const creatorName = document.querySelector('.video-creator-name');
            const creatorTag = document.querySelector('.video-creator-tag');
            const description = document.querySelector('.video-description');

            if (!cards.length || !prevBtn || !nextBtn) return;

            let activeIndex = 0;

            function updateCarousel() {
                cards.forEach((card, index) => {
                    // Remove all position classes
                    card.classList.remove('position-0', 'position-1', 'position-2', 'position-3');
                });

                // Force reflow to ensure animation restarts
                void cards[0].offsetWidth;

                cards.forEach((card, index) => {
                    // Calculate relative position from active index
                    const relativePos = (index - activeIndex + cards.length) % cards.length;

                    // Add position class (animation triggers automatically via CSS)
                    card.classList.add(`position-${relativePos}`);
                });

                // Update text content
                const activeCard = cards[activeIndex];
                if (creatorName) creatorName.textContent = activeCard.dataset.name;
                if (creatorTag) creatorTag.textContent = activeCard.dataset.tag;
                if (description) description.textContent = activeCard.dataset.description;
            }

            function handleNext() {
                activeIndex = (activeIndex + 1) % cards.length;
                updateCarousel();
            }

            function handlePrev() {
                activeIndex = (activeIndex - 1 + cards.length) % cards.length;
                updateCarousel();
            }

            prevBtn.addEventListener('click', handlePrev);
            nextBtn.addEventListener('click', handleNext);

            // Initial setup
            updateCarousel();
        }

        function initVideoLite() {
            document.querySelectorAll('.video-lite').forEach(btn => {
                btn.addEventListener('click', () => {
                    const src = btn.dataset.src;

                    const video = document.createElement('video');
                    video.src = src;
                    video.controls = true;
                    video.muted = true;
                    video.loop = true;
                    video.playsInline = true;
                    video.preload = 'metadata';
                    video.className = btn.className.replace('video-lite', '');
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'cover';
                    video.style.borderRadius = 'inherit';
                    video.controlsList = 'nodownload nofullscreen noremoteplayback';
                    video.title = 'Bu videonun sesi yoktur';

                    video.addEventListener('volumechange', () => {
                        if (!video.muted) {
                            video.muted = true;
                        }
                    });

                    btn.replaceWith(video);
                    video.play();
                });
            });
        }

    </script>
    
</body>
</html>
